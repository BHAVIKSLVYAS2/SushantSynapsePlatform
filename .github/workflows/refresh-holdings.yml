name: Refresh official fund holdings
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 2,6,10,12 * *'
permissions:
  contents: read
concurrency:
  group: refresh-fund-holdings
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/fund-overlap/ingestion/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r apps/fund-overlap/ingestion/requirements.txt
      - run: python -m unittest discover -s apps/fund-overlap/tests -p test_ingestion.py
      - run: python apps/fund-overlap/ingestion/refresh.py
      - run: node --test tests/fund-overlap.test.js
      - run: npm ci
      - run: npm run build:frontend
      - name: Deliver validated public references when hosting credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npm run deploy:frontend
          else
            echo 'Automatic delivery is unconnected: configure the two Cloudflare repository secrets. Verified references are available in the artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: verified-fund-holdings
          path: apps/fund-overlap/data
          retention-days: 30
          if-no-files-found: error
