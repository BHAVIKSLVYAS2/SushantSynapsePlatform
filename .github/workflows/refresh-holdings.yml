name: Refresh official fund holdings
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 2,6,10,12 * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: refresh-fund-holdings
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/fund-overlap/ingestion/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r apps/fund-overlap/ingestion/requirements.txt
      - run: python -m unittest discover -s apps/fund-overlap/tests -p 'test_*.py'
      - name: Find the latest successful public-reference artifact
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({...repo, workflow_id: 'refresh-holdings.yml', branch: context.ref.replace('refs/heads/', ''), status: 'success', per_page: 10});
            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;
              const result = await github.rest.actions.listWorkflowRunArtifacts({...repo, run_id: run.id, per_page: 100});
              if (result.data.artifacts.some(a => a.name === 'verified-fund-holdings' && !a.expired)) {
                core.setOutput('run_id', String(run.id));
                break;
              }
            }
      - uses: actions/download-artifact@v4
        if: steps.previous.outputs.run_id != ''
        with:
          name: verified-fund-holdings
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .publish/previous-fund-holdings
      - name: Restore validated last-good references from the previous run
        if: steps.previous.outputs.run_id != ''
        run: python apps/fund-overlap/ingestion/restore_official.py --from-artifact .publish/previous-fund-holdings
      - run: python apps/fund-overlap/ingestion/official_refresh.py
      - run: node --test tests/fund-overlap.test.js tests/fund-official-library.test.js
      - run: npm ci
      - run: npm run build:frontend
      - name: Deliver validated public references when hosting credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npm run deploy:frontend
          else
            echo 'Automatic delivery is unconnected: configure the two Cloudflare repository secrets. Verified references are available in the artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-fund-holdings
          path: apps/fund-overlap/data
          retention-days: 90
          if-no-files-found: error
