name: sushantsynapseplatform
services:
  platform:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      PUBLIC_ORIGIN: https://apps.sushantsynapse.com
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env before starting}
      DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
      SQLSERVER_SERVER: ${SQLSERVER_SERVER:-}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-}
      SQLSERVER_AUTH: ${SQLSERVER_AUTH:-managed-identity}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      SQLSERVER_USER: ${SQLSERVER_USER:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_AUTO_MIGRATE: "0"
      ARENA_COOKIE_SECRET: ${ARENA_COOKIE_SECRET:-}
    volumes:
      - platform_data:/app/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      platform:
        condition: service_healthy
volumes:
  platform_data:
  caddy_data:
  caddy_config:
