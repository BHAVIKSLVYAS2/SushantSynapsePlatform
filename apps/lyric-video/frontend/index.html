<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyric Video · WAV to MP4</title><link rel="stylesheet" href="/shared/premium.css"><link rel="stylesheet" href="/lyric-video/style.css"><script src="/shared/theme.js"></script><script defer src="/shared/platform-shell.js"></script><script defer src="/lyric-video/app.js"></script></head><body data-ui-app="lyric-video"><main><h1>Lyric Video</h1><p>Pair your WAV recording with lyrics and export a 720p video on this device.</p><canvas width="1280" height="720" aria-label="Lyric video preview"></canvas><audio controls aria-label="Preview and seek through your recording"></audio><fieldset><label>WAV recording<input id="file" type="file" accept=".wav,audio/wav"></label><label>Lyrics<textarea id="lyrics" rows="5" placeholder="One lyric line per row"></textarea></label><small>Plain lines share the track evenly. For precise timing, start every line with a timestamp such as [00:12.50].</small></fieldset><button id="export">Export MP4</button> <a id="save" hidden download="lyric-video.mp4">Download MP4</a><p role="status" id="status"></p></main></body></html>
