<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kiraya Saathi · Rent in good order</title><meta name="description" content="A simple on-device rent ledger for flats and shops. Track dues, partial payments, deposits and receipts without an account."><link rel="icon" href="/kiraya-saathi/icon.svg"><link rel="stylesheet" href="/shared/platform-header.css"><link rel="stylesheet" href="/shared/premium.css"><link rel="stylesheet" href="/shared/platform-shell.css"><link rel="stylesheet" href="/kiraya-saathi/style.css"><link rel="stylesheet" href="/shared/care.css"><script src="/shared/theme.js" defer></script><script src="/shared/platform-shell.js" defer></script><script src="/shared/language.js" defer></script><script type="module" src="/kiraya-saathi/app.mjs"></script></head>
<body data-ui-app="kiraya-saathi" class="platform-shell-pending" data-platform-privacy="local-only"><a class="skip" href="#main">Skip to rent ledger</a><header class="synapse-header platform-app-toolbar platform-toolbar-empty"><a href="/">Sushant Synapse</a><button data-theme-toggle aria-label="Change theme">Theme</button></header>
<main id="main" data-language-preserve><div class="app-heading"><div class="wordmark"><img src="/kiraya-saathi/icon.svg" width="44" height="44" alt=""><div><h1>Kiraya Saathi</h1><p>Har mahine ka kiraya, saaf hisaab.</p></div></div><button id="add-property" class="primary" data-rental-copy="Add property">Add property</button></div>
<label class="rental-language"><span data-rental-copy="Language">Language</span><select id="rental-language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="gu">ગુજરાતી</option></select></label>
<p class="local-note" data-rental-copy="On this browser · No account needed · Export backups regularly">On this browser · No account needed · Export backups regularly</p><p id="notice" role="status" aria-live="polite"></p><div id="workspace" aria-busy="true"><p>Opening your rent ledger…</p></div>
<nav id="app-nav" aria-label="Rental workspace"><button data-view="month" data-rental-copy="This month" aria-pressed="true">This month</button><button data-view="properties" data-rental-copy="Properties" aria-pressed="false">Properties</button><button data-view="history" data-rental-copy="History" aria-pressed="false">History</button><button data-view="backup" data-rental-copy="Backups" aria-pressed="false">Backups</button></nav>
<dialog id="editor" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-editor" type="button" data-rental-copy="Cancel">Cancel</button></div><div id="dialog-content"></div><p id="dialog-error" role="alert"></p></dialog>
<section id="print-area" aria-label="Rent payment receipt"></section></main><noscript>Kiraya Saathi needs JavaScript and browser storage.</noscript></body></html>
